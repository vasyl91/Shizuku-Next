org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false
# AGP 9 migration opt-outs: the Kotlin plugin is applied explicitly and the build scripts use the
# old Android DSL (signing.gradle, the rikka plugins). Both flags go away in a later AGP.
android.builtInKotlin=false
android.newDsl=false
# AGP 9 turns optimized resource shrinking on, and it needs non-final resource IDs, which this
# project turns off above. Back to the shrinker AGP 8 used rather than changing the IDs.
android.r8.optimizedResourceShrinking=false
